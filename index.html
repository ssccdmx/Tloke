<!DOCTYPE html>
<html lang="es">
    <!-- Asistente Inteligente de Coordinación Operativa para Redes TETRA Policiales -->

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://kit.fontawesome.com/4a84d99523.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/chatbox copy 2.js" defer></script>
    <link rel="icon" href="img/Tessia.png">
    <title>TESSIA FALCO</title>
</head>

<body>

    <!-- LOADING -->
    <div id="contenedor_carga">
        <div id="carga"></div>
    </div>


    <script>
        window.onload=function(){
            let contenedor=document.getElementById('contenedor_carga');
            contenedor.style.visibility='hidden';
            contenedor.style.opacity='.1';
        }

        // Solicitar permiso del micrófono
        window.addEventListener('load',()=>{
            if(navigator.mediaDevices &&
            navigator.mediaDevices.getUserMedia){
                navigator.mediaDevices
                .getUserMedia({audio:true})
                .then(stream=>{
                    console.log(
                    "Permiso de micrófono concedido"
                    );
                    stream.getTracks()
                    .forEach(track=>track.stop());
                })
                .catch(error=>{
                    console.error(
                    "Error micrófono:",
                    error
                    );
                });
            }
        });
    </script>
    <!-- FIN LOADING -->

    <!-- BOTON ABRIR CHAT -->
    <button class="chatbot-toggler">
        <span>
            <img src="img/Tessia.png" alt="Descripción de la imagen" width="60" height="60">
        </span>
        <span class="material-symbols-outlined">
            <!--<i class="fa-solid fa-xmark" ></i>-->
        </span>
    </button>

    <!-- CHATBOX -->
    <div class="chatbot">
        <header>
            <h2>
            Asistente Virtual - TESSIA FALCO
            </h2>
            <span class="close-btn material-symbols-outlined">
            <!--<i class="fa-solid fa-xmark" ></i>-->
            </span>
        </header>

        <ul class="chatbox">
            <li class="chat entrante">
                <span class="material-symbols-outlined">
                    <i><img src="img/TessiaButton.png" alt="Descripción de la imagen" width="40" height="40"></i>
                </span>
                <p>¡Hola soy TESSIA!, el asistente virtual de la BASE TETRA ¿En qué puedo ayudarte hoy?</p>
            </li>
        </ul>


        <!-- AREA DE ESCRITURA -->
        <div class="chat-input">
            <textarea id="message-input" placeholder="Ingrese mensaje..." required>
            </textarea>

            <!-- BOTON ENVIAR -->
            <span id="send-btn" class="material-symbols-outlined">
                <i class="fa-regular fa-paper-plane"></i>
            </span>

            <!-- BOTON MICROFONO -->
            <button id="start-btn">
                <i class="fa-solid fa-microphone"></i>
            </button>

            <!-- BOTON ACTIVAR/DESACTIVAR VOZ -->
            <button id="voice-btn" class="active">
                <i class="fa-solid fa-volume-high"></i>
            </button>

            <!-- BOTON DETENER VOZ -->
            <button id="stop-voice-btn">
                <i class="fa-solid fa-volume-xmark"></i>
            </button>

        </div>


    </div>


    <!-- JQUERY -->
    <script 
        src="https://code.jquery.com/jquery-3.0.0.js"
        integrity="sha256-jrPLZ+8vDxt2FnE1zvZXCkCcebI/C8Dt5xyaQBjxQIo="
        crossorigin="anonymous">
    </script>


    <script>
    //================================================
    // RECONOCIMIENTO DE VOZ
    //================================================
        if (!('webkitSpeechRecognition' in window)) {
            alert('Tu navegador no soporta reconocimiento de voz. Usa Google Chrome.');
        }
        else {
            const recognition =
            new webkitSpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            const startButton =
            document.getElementById('start-btn');
            const sendButton =
            document.getElementById('send-btn');
            const messageInput =
            document.getElementById('message-input');
            let timeout;

            function iniciarReconocimiento(){
                    messageInput.value="";
                    startButton.disabled=true;
                    startButton.classList.add("recording");
                    startButton.innerHTML="<p>...</p>";
                    timeout=setTimeout(()=>{
                        recognition.stop();
                        startButton.disabled=false;
                        startButton.classList.remove("recording");
                        startButton.innerHTML=
                        '<i class="fa-solid fa-microphone"></i>';
                        alert("Micrófono detenido por inactividad");
                    },15000);
                    recognition.start();
                }

                recognition.onstart=function(){
                    messageInput.placeholder="Escuchando...";
                };

                recognition.onresult=function(event){
                    clearTimeout(timeout);
                    let texto="";
                    for(let i=event.resultIndex;
                    i<event.results.length;
                    i++
                    ){texto+=event.results[i][0].transcript;}
                    messageInput.value=texto;
                };

                recognition.onend=function(){
                    messageInput.placeholder=
                    "Ingrese mensaje...";
                    startButton.disabled=false;
                    startButton.classList.remove("recording");

                startButton.innerHTML=
                '<i class="fa-solid fa-microphone"></i>';
                };

                recognition.onerror=function(event){
                    clearTimeout(timeout);
                    alert(
                    "Error de micrófono: "+event.error
                    );
                    startButton.disabled=false;
                    startButton.classList.remove(
                    "recording"
                    );
                    startButton.innerHTML=
                    '<i class="fa-solid fa-microphone"></i>';
                };


                sendButton.onclick=function(){
                    recognition.stop();
                    startButton.disabled=false;
                    startButton.classList.remove(
                    "recording"
                    );
                    startButton.innerHTML=
                    '<i class="fa-solid fa-microphone"></i>';
                };


                startButton.onclick=iniciarReconocimiento;
        }


        //================================================
        // CONTROL DE VOZ DEL CHATBOT
        //================================================
        let vozActiva=true;
        const voiceButton =
        document.getElementById("voice-btn");
        const stopVoiceButton =
        document.getElementById("stop-voice-btn");
        voiceButton.onclick=function(){
            vozActiva=!vozActiva;
            if(vozActiva){
                voiceButton.classList.add(
                "active"
                );
                voiceButton.innerHTML=
                '<i class="fa-solid fa-volume-high"></i>';
            }
            else {
                speechSynthesis.cancel();
                voiceButton.classList.remove(
                "active"
                );
                voiceButton.innerHTML=
                '<i class="fa-solid fa-volume-xmark"></i>';
            }
        };

        stopVoiceButton.onclick=function(){
            speechSynthesis.cancel();
        };


        // Esta función es utilizada por chatbox copy 2.js
        window.hablar=function(texto){
            if(!vozActiva)
            return;
            if(!("speechSynthesis" in window))
            return;
            speechSynthesis.cancel();
            let mensaje =
            new SpeechSynthesisUtterance(texto);
            mensaje.lang="es-MX";
            mensaje.rate=1;
            mensaje.pitch=1;
            mensaje.volume=1;
            let voces =
            speechSynthesis.getVoices();
            let voz =
            voces.find(
            v=>v.lang==="es-MX"
            )
            ||
            voces.find(
            v=>v.lang.startsWith("es")
            );
            if(voz){
                mensaje.voice=voz;
            }
            speechSynthesis.speak(
            mensaje
            );
        };

        speechSynthesis.onvoiceschanged=function(){
            speechSynthesis.getVoices();
        };

    </script>

</body>

</html>
